apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-artificial-intelligence-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-artificial-intelligence-core
  template:
    metadata:
      labels:
        app: ms-artificial-intelligence-core
    spec:
      containers:
      - name: ms-artificial-intelligence-core
        image: us-central1-docker.pkg.dev/zera1405/repo/ms-artificial-intelligence-core:latest
        imagePullPolicy: Always  
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: OPENAI_API_KEY
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_URI