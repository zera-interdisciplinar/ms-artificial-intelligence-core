apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-artificial-intelligence-core
  namespace: qa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms-artificial-intelligence-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-artificial-intelligence-core
    spec:
      containers:
      - name: ms-artificial-intelligence-core
        image: southamerica-east1-docker.pkg.dev/zera-506513/repo/ms-artificial-intelligence-core:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: APP_ENV
          value: "QA"
        - name: APP_PORT
          value: "8000"
        - name: APP_HOST
          value: "0.0.0.0"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: MONGO_URI
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: MONGO_DB_NAME
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: MONGO_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: MONGO_PASSWORD
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: GROQ_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: GEMINI_API_KEY
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: SUPABASE_URL
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: SUPABASE_SERVICE_ROLE_KEY
        - name: SUPABASE_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: ms-artificial-intelligence-core-secrets
              key: SUPABASE_BUCKET_NAME