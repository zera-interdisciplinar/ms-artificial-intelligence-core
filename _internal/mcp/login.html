<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar na Zera</title>
<style>
  :root {
    --cream: #f4efe3;
    --ink: #1c3f86;
    --orange: #e39b2b;
    --line: #d7b5a4;
    --muted: #6d6458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e6e9ee;
    font-family: "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .card {
    width: min(380px, calc(100% - 32px));
    min-height: 520px;
    padding: 48px 36px 40px;
    background:
      repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.45) 18px 20px),
      var(--cream);
    border-radius: 28px;
    box-shadow: 0 16px 40px rgba(28, 63, 134, .12);
  }
  .mark {
    margin: 12px 0 0;
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: .18em;
  }
  .hello {
    margin: 4px 0 28px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  label {
    display: block;
    margin: 14px 0 6px;
    font-size: 13px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffdf8;
    padding: 12px 14px;
    font: inherit;
    color: var(--ink);
  }
  .error {
    margin: 0 0 8px;
    color: #9a3b2f;
    font-size: 13px;
  }
  button {
    display: block;
    width: 70%;
    margin: 28px auto 0;
    border: 0;
    border-radius: 999px;
    background: var(--orange);
    color: #fff;
    font: inherit;
    font-weight: 700;
    padding: 12px 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="mark">ZERA</p>
    <p class="hello">Bem-vindo!</p>
    __ERROR__
    <form method="post">
      <input type="hidden" name="txn" value="__TXN__">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
